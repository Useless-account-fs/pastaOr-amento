<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Orçamento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Gerador de Orçamento</h1>
            <p>Monte seu orçamento de produtos e serviços de forma rápida</p>
        </header>

        <div class="content">
            <!-- Formulário de cadastro -->
            <div class="form-section">
                <h2>➕ Adicionar Item</h2>
                <form id="formItem">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="descricao">Descrição</label>
                            <input type="text" id="descricao" placeholder="Ex: Serviço de consultoria" required>
                        </div>
                        <div class="form-group">
                            <label for="tipo">Tipo</label>
                            <select id="tipo" required>
                                <option value="Produto">Produto</option>
                                <option value="Serviço">Serviço</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quantidade">Qtd.</label>
                            <input type="number" id="quantidade" min="1" step="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label for="valor">Valor Unit. (R$)</label>
                            <input type="number" id="valor" min="0" step="0.01" placeholder="0,00" required>
                        </div>
                        <button type="submit" class="btn btn-add">Adicionar</button>
                    </div>
                </form>
            </div>

            <!-- Tabela de itens -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Descrição</th>
                            <th>Tipo</th>
                            <th>Qtd.</th>
                            <th>Valor Unit.</th>
                            <th>Subtotal</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaItens">
                        <tr class="empty-row">
                            <td colspan="7">Nenhum item adicionado ainda</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Totais e desconto -->
            <div class="totals-section">
                <div class="totals-box">
                    <div class="discount-input">
                        <label for="desconto">Desconto (%):</label>
                        <input type="number" id="desconto" min="0" max="100" step="0.01" value="0">
                    </div>
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>
                    <div class="total-row discount">
                        <span>Desconto:</span>
                        <span id="valorDesconto">- R$ 0,00</span>
                    </div>
                    <div class="total-row final">
                        <span>TOTAL:</span>
                        <span id="total">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <!-- Ações -->
            <div class="actions">
                <button class="btn btn-clear" id="btnLimpar">🗑️ Limpar Tudo</button>
                <button class="btn btn-print" id="btnImprimir">🖨️ Imprimir</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
